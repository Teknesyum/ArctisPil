name: Headset support request
description: Ask for a headset that is not supported yet.
labels: [device]
body:
  - type: markdown
    attributes:
      value: |
        Most headsets are handled by the bundled [HeadsetControl](https://github.com/Sapd/HeadsetControl#supported-headsets). Check its list first; if your model is missing there, a request upstream helps every tool that uses it. Bluetooth headsets show their battery when Windows reports it.
  - type: input
    id: model
    attributes:
      label: Headset model
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB dongle / base station
        - Bluetooth
        - USB cable
    validations:
      required: true
  - type: input
    id: ids
    attributes:
      label: USB IDs
      description: Device Manager > the headset's HID entry > Details > Hardware Ids, e.g. VID_1038&PID_12E0.
  - type: checkboxes
    id: features
    attributes:
      label: What you want to see
      options:
        - label: Battery
        - label: Volume
        - label: ANC / transparency
        - label: Sidetone
